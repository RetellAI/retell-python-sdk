name: Release Doctor
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release_doctor:
    name: release doctor
    runs-on: ubuntu-latest
    if: github.repository == 'RetellAI/retell-python-sdk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please') || github.head_ref == 'next')

    steps:
      - name: Validate SDK GitHub App access
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_MANAGER_PVT_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: retell-python-sdk
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check release environment
        run: |
          bash ./bin/check-release-environment
        env:
          PYPI_TOKEN: ${{ secrets.RETELL_PYPI_TOKEN || secrets.PYPI_TOKEN }}
